# AuthN: require Google login on qbittorrent.home.bkanuka.com via oauth2-proxy forward-auth.
# Lives in istio-system (the gateway's namespace) but is owned by this app so
# auth config stays co-located with the service it protects.
#
# action: CUSTOM sends matching requests to the `oauth2-proxy` extensionProvider
# (platform/istio meshConfig -> oauth2-proxy's ext_authz endpoint). Unauthenticated
# -> 302 to Google; authenticated -> allowed, with x-auth-request-email set.
# Scoped to this host so every OTHER service on the shared gateway stays open.
# WHO may use the app is a separate, per-app DENY policy: see allowlist.yaml.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: qbittorrent-ext-authz
  namespace: istio-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
  - to:
    - operation:
        hosts:
        - qbittorrent.home.bkanuka.com
