
mqtt:
  enabled: true
  host: ha.home.bkanuka.com  # resolves via UniFi (the host's DNS points at the router)
  topic_prefix: frigate

  user: mqtt
  password: "{FRIGATE_MQTT_PASSWORD}"

tls:
  enabled: False


detectors:
  onnx_0:
    type: onnx
    device: "0"
  onnx_1:
    type: onnx
    device: "1"

ffmpeg:
  hwaccel_args: preset-nvidia

  #model:
  #model_type: yolonas
  #width: 320 
  #height: 320
  #input_pixel_format: bgr
  #input_tensor: nchw
  #path: /config/yolo_nas_s.onnx
  #labelmap_path: /labelmap/coco-80.txt

model:
  path: plus://e9f2bb62bf3fc721bce6a2862f401a55  # Frigate+ yolonas 320x320, trained 2025-07-23 (was the 640x640 one, b020fa9f...; ~39 ms -> ~16 ms)

cameras:
  backyard:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/backyard
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/backyard_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    objects:
      track:
        - person
    motion:
      mask:
        tree:  # branches at the top right
          friendly_name: Tree
          enabled: true
          coordinates: 0.557,0.004,0.556,0.26,0.638,0.322,1,0.207,1,0
  chicken_coop_1:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/chicken_coop_1
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/chicken_coop_1_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    objects:
      track:
        - chicken
        - bird
    motion:  # less sensitive than the default: IR noise at night counted as motion
      threshold: 40
      contour_area: 30
      improve_contrast: false
      mask:
        swing:  # hanging chains
          friendly_name: swing
          enabled: true
          coordinates: 0.387,0.906,0.381,0,0.42,0,0.453,0.782,0.523,0.875,0.59,0,0.632,0,0.564,0.912,0.591,0.946,0.57,1,0.444,1
  chicken_coop_2:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy  # AAC from the camera
      inputs:
        - path: rtsp://127.0.0.1:8554/chicken_coop_2
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/chicken_coop_2_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    objects:
      track:
        - chicken
        - bird
    motion:  # less sensitive than the default: IR noise at night counted as motion
      threshold: 40
      contour_area: 30
      improve_contrast: false
      mask:
        swing:  # hanging chains
          friendly_name: swing
          enabled: true
          coordinates: 0.389,0,0.463,0.682,0.616,0.684,0.7,0,0.673,0,0.593,0.549,0.489,0.55,0.41,0
  chicken_run:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/chicken_run
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/chicken_run_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    motion:
      threshold: 31
      contour_area: 35
      improve_contrast: true
    objects:
      track:
        - person
        - dog
        - chicken
        - bird  # chickens come out as bird until the Frigate+ label graduates

go2rtc:
  webrtc:
    candidates:
      - 192.168.1.201:8555
      - stun:8555
  streams:
    backyard:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.187:554/Streaming/Channels/101
    backyard_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.187:554/Streaming/Channels/102
    chicken_coop_1:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.150:554/Streaming/Channels/101
    chicken_coop_1_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.150:554/Streaming/Channels/102
    chicken_coop_2:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.246:554/cam/realmonitor?channel=1&subtype=0
    chicken_coop_2_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.246:554/cam/realmonitor?channel=1&subtype=1
    chicken_run:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.156:554/Streaming/Channels/101
    chicken_run_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.156:554/Streaming/Channels/102

# Every camera records its main stream and detects on its substream (5-6 fps).
# chicken_run's is 640x360; the others send the 16:9 picture squeezed into
# 640x480 (the largest they offer) and detect scales it back to 16:9.
# Alerts are what needs a look (people, predators); chickens/birds are detections.
detect:
  enabled: true
  width: 640
  height: 360
  fps: 5
review:
  alerts:
    labels:
      - person
      - dog
      - cat
objects:
  track:
    - person
    - chicken  # Frigate+ candidate label: chickens are detected as bird until it graduates
    - dog
    - cat
    - bird
  filters:
    bird:  # default threshold 0.7, min_score 0.5; coops gave false birds at 57-75%
      min_score: 0.55
      threshold: 0.75
record:
  enabled: True
  motion:  # continuous recording is off; keep motion segments 10 days
    days: 10
  alerts:
    retain:
      days: 60
      mode: motion
  detections:
    retain:
      days: 60
      mode: motion
snapshots:
  enabled: True
  retain:
    default: 10
version: 0.18-0
semantic_search:
  enabled: false
  model_size: small
face_recognition:
  enabled: false
  model_size: small
lpr:
  enabled: false
classification:
  bird:
    enabled: false

# Google login happens at the gateway (oauth2-proxy); trust its email header.
auth:
  enabled: false
proxy:
  header_map:
    user: x-auth-request-email
    role: x-auth-request-email  # role_map matches on the email; others fall back to viewer
    role_map:
      admin:
        - bkanuka@gmail.com
