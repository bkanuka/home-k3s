apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home-gateway  # the one shared Gateway; every app's HTTPRoute attaches here
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
  - name: http  # only serves HTTP->HTTPS redirects
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # One HTTPS listener for every host (no hostname = one Envoy filter chain). Separate
  # wildcard/apex listeners were separate chains, and browsers that coalesce HTTP/2
  # connections across hosts sharing the cert and IP then hit the wrong chain (no
  # route, no login check). The cert comes from certificate.yaml.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""  # explicit: avoids Argo CD drift
        kind: Secret
        name: wildcard-home-bkanuka-tls
    allowedRoutes:
      namespaces:
        from: All
  # Plex Remote Access passthrough: Plex terminates its own TLS, so this is L4 TCP.
  # Routed by applications/plex/tcproute.yaml; needs WAN 32400 forwarded to 192.168.1.200.
  - name: plex-pms
    protocol: TCP
    port: 32400
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
