apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The provider config (domains + Gandi token) is not in git; config.json.example
# shows its format. The live copy is on the server at /mnt/main/config/ddns-updater.
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host
