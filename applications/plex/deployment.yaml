apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: Recreate  # /config hostPath can't be shared by two pods
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      hostname: plex  # Plex's default server name; otherwise the hashed pod name
      runtimeClassName: nvidia  # GPU for hardware transcoding
      containers:
      - name: plex
        image: lscr.io/linuxserver/plex:latest
        env:
        # media + config on the host are owned by 1000:1000
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: VERSION
          value: docker
        # NVIDIA_VISIBLE_DEVICES is set by the device plugin to the allocated GPU
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        ports:
        - name: pms
          containerPort: 32400
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            nvidia.com/gpu: 1  # must be a limit, not a request
        volumeMounts:
        - name: config
          mountPath: /config
        - name: movies
          mountPath: /data/movies
        - name: tvshows
          mountPath: /data/tvshows
      volumes:
      - name: config
        hostPath:
          path: /mnt/main/config/plex
          type: Directory
      - name: movies
        hostPath:
          path: /mnt/media/Movies
          type: Directory
      - name: tvshows
        hostPath:
          path: /mnt/media/TV
          type: Directory
