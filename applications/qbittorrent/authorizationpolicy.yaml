# Requires Google login (oauth2-proxy) on this host, except for Web API calls that
# carry an API key (Authorization: Bearer ...), which qBittorrent validates itself.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: qbittorrent-ext-authz
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy  # extensionProvider in the Istio meshConfig
  rules:
  - to:
    - operation:
        hosts:
        - qbittorrent.home.bkanuka.com
        notPaths:
        - /api/v2/*
  - to:
    - operation:
        hosts:
        - qbittorrent.home.bkanuka.com
        paths:
        - /api/v2/*
    when:
    - key: request.headers[authorization]
      notValues:  # also matches when the header is absent
      - Bearer *
