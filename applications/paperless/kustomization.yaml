apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# paperless.env is git-managed (ConfigMap). Secrets (Django key, DB password) come
# from the sealed paperless-secrets Secret; plaintext secrets (from *.yaml.example)
# are git-ignored, seal them with platform/sealed-secrets/seal.sh. Google login
# maps to the Paperless user whose username is the Google email.
resources:
- namespace.yaml
- paperless-secrets-secret-sealed.yaml
- postgres.yaml
- redis.yaml
- tika.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host

configMapGenerator:
- name: paperless-config  # hash suffix rolls the pod when the env changes
  namespace: paperless
  envs:
  - paperless.env
