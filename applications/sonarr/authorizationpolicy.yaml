# Requires Google login (oauth2-proxy) on this host, except the API and calendar feeds,
# which Sonarr protects with its own API key (X-Api-Key header or ?apikey=).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: sonarr-ext-authz
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy  # extensionProvider in the Istio meshConfig
  rules:
  - to:
    - operation:
        hosts:
        - sonarr.home.bkanuka.com
        notPaths:
        - /api/*
        - /feed/*
