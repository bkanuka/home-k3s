apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# qBittorrent.conf is git-managed: edit it here, not in the Web UI (UI changes are
# overwritten on the next start; the previous file is kept as qBittorrent.conf.prev).
# WebUI\APIKey is the __WEBUI_API_KEY__ placeholder, filled from the sealed
# qbittorrent-apikey Secret; Session\Port is rewritten by the image to PIA's
# forwarded port. Plaintext secrets (from *.yaml.example) are git-ignored; seal
# them with platform/sealed-secrets/seal.sh.
resources:
- namespace.yaml
- pia-credentials-sealed.yaml
- qbittorrent-apikey-secret-sealed.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host

configMapGenerator:
- name: qbittorrent-config  # hash suffix rolls the pod when the conf changes
  namespace: qbittorrent
  files:
  - qBittorrent.conf
