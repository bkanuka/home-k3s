# The dedicated auth host: Google's single redirect URI
# (https://auth.home.bkanuka.com/oauth2/callback) lands here, as do
# /oauth2/sign_out and /oauth2/userinfo. Deliberately NOT behind any
# AuthorizationPolicy — the callback has to be reachable while unauthenticated.
# Because the session cookie is scoped to .home.bkanuka.com, no protected app
# needs its own copy of these paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: https
  hostnames:
  - auth.home.bkanuka.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""      # explicit: CRD defaults, spelled out so Argo CD (server-side
      kind: Service  # apply) doesn't report the defaulting as drift
      name: oauth2-proxy
      port: 4180
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy-https-redirect
  namespace: oauth2-proxy
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: http
  hostnames:
  - auth.home.bkanuka.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
