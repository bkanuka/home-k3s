apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# config.xml is git-managed: edit it here, not in the Web UI (UI changes are
# overwritten on the next start; the previous file is kept as config.xml.prev).
# ApiKey is the __SONARR_API_KEY__ placeholder, filled from the sealed sonarr-apikey
# Secret. Plaintext secrets (from *.yaml.example) are git-ignored; seal them with
# platform/sealed-secrets/seal.sh.
resources:
- namespace.yaml
- sonarr-apikey-secret-sealed.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host

configMapGenerator:
- name: sonarr-config  # hash suffix rolls the pod when the config changes
  namespace: sonarr
  files:
  - config.xml
