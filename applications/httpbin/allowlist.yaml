# Denies this host to anyone whose Google account is not listed below.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: httpbin-allowlist
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: DENY
  rules:
  - to:
    - operation:
        hosts:
        - httpbin.home.bkanuka.com
        ports:
        - "443"  # HTTPS only; a DENY with just HTTP fields would also drop the Plex TCP listener
    when:
    - key: request.headers[x-auth-request-email]  # set by oauth2-proxy (ext_authz)
      notValues:  # also matches when the header is absent
      - bkanuka@gmail.com
