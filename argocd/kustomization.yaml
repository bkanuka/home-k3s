apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Everything Argo CD manages for itself after bootstrap; the self-managing
# Application in apps/ points at this directory.
resources:
- base/
- apps/
- httproute.yaml             # needs the Gateway API CRDs from platform/gateway-api
- argocd-secret-sealed.yaml  # GitHub webhook key + Google OIDC client, patched into argocd-secret
