apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Argo CD itself: what install.sh applies on a bare k3s with `kubectl apply -k`.
resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml

patches:
- path: cmd-params-patch.yaml  # server.insecure: plain HTTP behind the gateway
  target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
- path: cm-patch.yaml  # Google OIDC SSO + kustomize --enable-helm
  target:
    kind: ConfigMap
    name: argocd-cm
- path: rbac-patch.yaml  # which Google accounts are admin
  target:
    kind: ConfigMap
    name: argocd-rbac-cm
# Lets ../argocd-secret-sealed.yaml add keys to the upstream argocd-secret without
# owning it. The live Secret must carry the patch annotation — the controller
# ignores it on the SealedSecret.
- target:
    kind: Secret
    name: argocd-secret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        sealedsecrets.bitnami.com/patch: "true"
