apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home-gateway  # the one shared Gateway; every app's HTTPRoute attaches here
  namespace: istio-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt  # cert-manager issues certs for the HTTPS listeners below
spec:
  gatewayClassName: istio
  listeners:
  - name: http  # only serves HTTP->HTTPS redirects
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # The wildcard and apex listeners share one Secret, so cert-manager issues a
  # single cert with both SANs (a wildcard does not match the apex).
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.home.bkanuka.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""  # explicit: avoids Argo CD drift
        kind: Secret
        name: wildcard-home-bkanuka-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: https-apex  # bare home.bkanuka.com; nothing routes here yet
    protocol: HTTPS
    port: 443
    hostname: "home.bkanuka.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard-home-bkanuka-tls
    allowedRoutes:
      namespaces:
        from: All
  # Plex Remote Access passthrough: Plex terminates its own TLS, so this is L4 TCP.
  # Routed by applications/plex/tcproute.yaml; needs WAN 32400 forwarded to 192.168.1.200.
  - name: plex-pms
    protocol: TCP
    port: 32400
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
