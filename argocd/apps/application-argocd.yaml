apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/bkanuka/home-k3s.git
    targetRevision: main
    path: argocd   # Argo CD manages its own directory from git
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true  # the install manifest's CRDs exceed the client-side annotation limit
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true  # HTTPRoute/SealedSecret CRDs come from platform apps; retry until they exist
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
