apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sealed Secrets controller: decrypts committed SealedSecret CRs into Secrets in-cluster.
# A fresh controller key cannot decrypt existing SealedSecrets: install.sh restores
# the backed-up key (/mnt/main/config/sealed-secrets/master.key) before this deploys.
resources:
- namespace.yaml

helmCharts:
- name: sealed-secrets
  repo: https://bitnami.github.io/sealed-secrets
  version: 2.19.1   # controller app v0.38.4
  releaseName: sealed-secrets
  namespace: sealed-secrets
  includeCRDs: true
  valuesInline:
    fullnameOverride: sealed-secrets-controller  # matches kubeseal's --controller-name default
