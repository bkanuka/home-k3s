apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ingress-only Istio (base + istiod; no sidecars, ambient or cni): the Gateway API
# control plane plus the ext_authz provider for oauth2-proxy.
resources:
- namespace.yaml

helmCharts:
- name: base  # CRDs + cluster-scoped resources
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.29.2
  releaseName: istio-base
  namespace: istio-system
  includeCRDs: true

- name: istiod
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.29.2
  releaseName: istiod
  namespace: istio-system
  valuesInline:
    pilot:
      env:
        PILOT_ENABLE_ALPHA_GATEWAY_API: "true"  # TCPRoute (experimental channel) for the Plex passthrough
    # ext_authz provider (Google login via oauth2-proxy); apps opt in with an
    # AuthorizationPolicy of action: CUSTOM.
    meshConfig:
      extensionProviders:
      - name: oauth2-proxy
        envoyExtAuthzHttp:
          service: oauth2-proxy.oauth2-proxy.svc.cluster.local
          port: 4180
          # Session cookie, on top of the always-forwarded Host/Method/Path.
          includeRequestHeadersInCheck:
          - cookie
          - authorization
          # Post-login redirect target: oauth2-proxy ignores X-Forwarded-* for this
          # and honours only X-Auth-Request-Redirect (%REQ(:path)% includes the query).
          includeAdditionalHeadersInCheck:
            X-Auth-Request-Redirect: "https://%REQ(:authority)%%REQ(:path)%"
          # Identity headers passed to the app on allow (overwritten from the
          # ext_authz response, so a client can't spoof them).
          headersToUpstreamOnAllow:
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-preferred-username
          - x-auth-request-groups
          # On deny, relay the 302 to Google and its CSRF cookie to the browser.
          headersToDownstreamOnDeny:
          - content-type
          - set-cookie
          - location
          - www-authenticate
