apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# qBittorrent.conf, categories.json and watched_folders.json are git-managed: edit
# them here, not in the Web UI (UI changes are overwritten on the next start; the
# previous conf is kept as qBittorrent.conf.prev). post-vpn-connect.sh refreshes the
# myanonamouse seedbox IP after the VPN comes up.
# WebUI\APIKey is the __WEBUI_API_KEY__ placeholder, filled from the sealed
# qbittorrent-apikey Secret; Session\Port is rewritten by the image to PIA's
# forwarded port. WebUI settings live under [Preferences] as WebUI\<key> (the
# 5.2 layout); qBittorrent 5.3 moved them to a [WebUI] section, so convert
# them back when the image is upgraded. Plaintext secrets (from *.yaml.example) are git-ignored; seal
# them with platform/sealed-secrets/seal.sh.
resources:
- namespace.yaml
- pia-credentials-sealed.yaml
- qbittorrent-apikey-secret-sealed.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host

configMapGenerator:
- name: qbittorrent-config  # hash suffix rolls the pod when the conf changes
  namespace: qbittorrent
  files:
  - qBittorrent.conf
  - categories.json
  - watched_folders.json
  - post-vpn-connect.sh
