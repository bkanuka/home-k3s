# Glances config, mounted at /etc/glances/glances.conf. Only overrides are listed;
# anything absent uses Glances' built-in defaults. Reference for every key:
# https://github.com/nicolargo/glances/blob/develop/conf/glances.conf
#
# The host's / is mounted at /rootfs, so host mount points appear as /rootfs/...

[global]
check_update=False

[outputs]
max_processes_display=30

[network]
# The LAN bridge only (it carries enp6s0f0); skips lo, docker0 and k3s pod plumbing.
show=br0

[diskio]
# Whole disks only, not partitions.
hide=loop.*,/dev/loop.*,sd[a-z]+[0-9]+

[fs]
refresh=60
# Host root and the local ZFS pools; not kubelet or container mounts.
show=/rootfs,/rootfs/mnt/main.*,/rootfs/mnt/stripe.*
alias=/rootfs:root,/rootfs/mnt/main:main,/rootfs/mnt/stripe:stripe

[smart]
disable=False
refresh=300
# Show only the failure counters (any non-zero raw value is bad). Glances hides
# attributes by exact name only, so this is every other attribute these disks report.
hide_attributes=Airflow_Temperature_Cel,Available_Reservd_Space,CRC_Error_Count,Command_Timeout,ECC_Error_Rate,End-to-End_Error,Erase_Fail_Count_Total,G-Sense_Error_Rate,Hardware_ECC_Recovered,Head_Flying_Hours,Head_Health,High_Fly_Writes,Load_Cycle_Count,Media_Wearout_Indicator,POR_Recovery_Count,Power-Off_Retract_Count,Power_Cycle_Count,Power_On_Hours,Pressure_Limit,Program_Fail_Cnt_Total,Raw_Read_Error_Rate,Runtime_Bad_Block,Seek_Error_Rate,Spin_Retry_Count,Spin_Up_Time,Start_Stop_Count,Temperature_Celsius,Total_LBAs_Read,Total_LBAs_Written,Unknown_Attribute,Unknown_SSD_Attribute,Used_Rsvd_Blk_Cnt_Tot,Wear_Leveling_Count

[sensors]
hide=unknown.*

[containers]
# k3s runs containerd, which Glances can't read.
disable=True

[ip]
public_disabled=True
