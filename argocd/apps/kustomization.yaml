apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# What Argo CD deploys: two ApplicationSets (one Application per platform/* and
# applications/* directory) and the Application that makes Argo CD manage its
# own ../ directory. Applied by install.sh right after ../base so the platform
# (sealed-secrets, cert-manager, gateway) starts syncing from git immediately.
resources:
- applicationset-platform.yaml
- applicationset-applications.yaml
- application-argocd.yaml
