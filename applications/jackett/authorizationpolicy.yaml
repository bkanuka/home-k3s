# Requires Google login (oauth2-proxy) on this host. No API exemption: Jackett has
# no admin password, so its /api/v2.0/server and indexer-config endpoints are open
# to anyone who can reach them; API consumers use the in-cluster Service instead.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: jackett-ext-authz
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy  # extensionProvider in the Istio meshConfig
  rules:
  - to:
    - operation:
        hosts:
        - jackett.home.bkanuka.com
