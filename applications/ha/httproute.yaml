# Home Assistant at ha.home.bkanuka.com. No Google login in front: the companion
# app needs HA's own auth end to end.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha
  namespace: ha
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: https
  hostnames:
  - ha.home.bkanuka.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: networking.istio.io
      kind: Hostname
      name: home-assistant.ha.internal
      port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-https-redirect
  namespace: ha
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: http
  hostnames:
  - ha.home.bkanuka.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
