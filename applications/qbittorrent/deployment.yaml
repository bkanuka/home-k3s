# qBittorrent + PIA WireGuard VPN. The qBittorrent config files are git-managed: the
# render-config initContainer writes the ConfigMap copies over /config on every start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate  # /config hostPath can't be shared by two pods
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
      # Keeps the old conf as .prev, writes the ConfigMap copies with the API key filled in.
      # post-vpn-connect.sh goes to /config: the image sources it from there after the VPN is up.
      - name: render-config
        image: busybox:1.37.0
        command: ["sh", "-ec"]
        args:
        - |
          cfg=/config/qBittorrent/config
          mkdir -p "$cfg"
          install_file() {  # install_file <src> <dst>
            cp "$1" "$2.tmp"
            chown 1000:1000 "$2.tmp" && chmod 600 "$2.tmp"
            mv "$2.tmp" "$2"
          }
          [ ! -f "$cfg/qBittorrent.conf" ] || cp -p "$cfg/qBittorrent.conf" "$cfg/qBittorrent.conf.prev"
          sed "s|__WEBUI_API_KEY__|$WEBUI_API_KEY|" /seed/qBittorrent.conf > /tmp/qBittorrent.conf
          install_file /tmp/qBittorrent.conf "$cfg/qBittorrent.conf"
          install_file /seed/categories.json "$cfg/categories.json"
          install_file /seed/watched_folders.json "$cfg/watched_folders.json"
          install_file /seed/post-vpn-connect.sh /config/post-vpn-connect.sh
        env:
        - name: WEBUI_API_KEY
          valueFrom:
            secretKeyRef:
              name: qbittorrent-apikey
              key: WEBUI_API_KEY
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-seed
          mountPath: /seed
          readOnly: true
      containers:
      - name: qbittorrent
        image: j4ym0/pia-qbittorrent
        # A container restart keeps the pod's network namespace, i.e. the previous run's
        # kill-switch (OUTPUT DROP, only the old PIA server allowed) and dead WireGuard
        # interface; the image fetches its PIA token before it resets the firewall, so
        # clear both first (both iptables backends: the image picks one at run time).
        # The image's baked-in PIA server list goes stale (TLS name mismatch on addKey),
        # so replace it with the live one when that can be fetched.
        command: ["sh", "-c"]
        args:
        - |
          for ipt in "/usr/sbin/xtables-nft-multi iptables" "/usr/sbin/xtables-legacy-multi iptables"; do
            for t in filter nat; do $ipt -t $t -F; $ipt -t $t -X; done
            for c in INPUT OUTPUT FORWARD; do $ipt -P $c ACCEPT; done
          done 2>/dev/null
          ip link del pia 2>/dev/null
          curl -sf -m 30 https://serverlist.piaservers.net/vpninfo/servers/v6 | head -1 > /tmp/data.json \
            && jq -e .regions /tmp/data.json >/dev/null && mv /tmp/data.json /app/data.json
          exec /app/entrypoint.sh
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]  # WireGuard interface
        envFrom:
        - secretRef:  # PIA_USERNAME, PIA_PASSWORD
            name: pia-credentials
        env:
        - name: PIA_REGION
          value: ca_toronto
        - name: PORT_FORWARDING
          value: "true"
        - name: VPN_CLIENT
          value: wireguard
        - name: UID
          value: "1000"
        - name: GID
          value: "1000"
        - name: TZ
          value: America/Toronto
        ports:
        - name: webui
          containerPort: 8888
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: media
          mountPath: /downloads/complete
          subPath: Unsorted
        - name: media
          mountPath: /downloads/temp
          subPath: Incomplete
        - name: config
          mountPath: /config
      volumes:
      - name: media  # TrueNAS export
        nfs:
          server: 192.168.1.15
          path: /mnt/main/media
      - name: config
        hostPath:
          path: /mnt/main/config/qbittorrent
          type: Directory
      - name: config-seed
        configMap:
          name: qbittorrent-config
