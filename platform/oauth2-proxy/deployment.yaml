# oauth2-proxy (pinned). Stateless — sessions live in the (encrypted) cookie, so
# no Redis. Config comes from the generated oauth2-proxy-config ConfigMap
# (kustomization.yaml) + the sealed oauth2-proxy-secret (Google client id/secret,
# cookie secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
        envFrom:
        - configMapRef:
            name: oauth2-proxy-config
        - secretRef:
            name: oauth2-proxy-secret
        ports:
        - name: http
          containerPort: 4180
        readinessProbe:
          httpGet:
            path: /ready
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
