# One Application per platform/<name>/: cluster-level pieces (Gateway API CRDs,
# MetalLB, Istio, GPU plugin, sealed-secrets, cert-manager, the shared gateway).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/bkanuka/home-k3s.git
      revision: main
      directories:
      - path: platform/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bkanuka/home-k3s.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true      # delete resources removed from git
          selfHeal: true   # revert manual drift back to git state
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true  # Helm-inflated CRDs exceed the client-side annotation limit
        - ServerSideDiff=true  # without it, API-server-defaulted fields show as permanent drift
        - SkipDryRunOnMissingResource=true  # CRs whose CRDs arrive in the same or a sibling sync
        - RespectIgnoreDifferences=true  # apply ignoreDifferences during sync, not only diff
        # Cross-app ordering is by retry: keep going until sibling apps' CRDs exist.
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      # caBundle (and istiod's failurePolicy) are rewritten at runtime by istiod,
      # MetalLB and cert-manager's cainjector.
      ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
