# Google OIDC SSO for Argo CD. The OAuth client needs the Authorized redirect URI
# https://argocd.home.bkanuka.com/auth/callback; its id/secret come from argocd-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  kustomize.buildOptions: --enable-helm  # platform/* kustomizations use helmCharts:
  url: https://argocd.home.bkanuka.com  # required for correct OIDC redirect URLs behind the gateway
  oidc.config: |
    name: Google
    issuer: https://accounts.google.com
    clientID: $oidc.google.clientId
    clientSecret: $oidc.google.clientSecret
    requestedScopes: ["openid", "profile", "email"]
