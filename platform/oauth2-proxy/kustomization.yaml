apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# oauth2-proxy: Google login for the whole gateway, as Istio's ext_authz backend.
# Authentication only (any Google account may sign in); each app's allowlist.yaml
# decides who may use it, matching on the x-auth-request-email header emitted here.
namespace: oauth2-proxy

resources:
- namespace.yaml
- oauth2-proxy-secret-sealed.yaml
- deployment.yaml
- service.yaml
- httproute.yaml

configMapGenerator:
# Non-secret settings as OAUTH2_PROXY_* env vars (flag name upper-cased, list flags pluralised).
- name: oauth2-proxy-config
  literals:
  - OAUTH2_PROXY_PROVIDER=google
  - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
  - OAUTH2_PROXY_EMAIL_DOMAINS=*  # any Google account; apps restrict by email in Istio
  - OAUTH2_PROXY_REDIRECT_URL=https://auth.home.bkanuka.com/oauth2/callback
  - OAUTH2_PROXY_COOKIE_DOMAINS=.home.bkanuka.com  # one session cookie for every app
  - OAUTH2_PROXY_WHITELIST_DOMAINS=.home.bkanuka.com  # post-login redirects may target any host under it
  - OAUTH2_PROXY_COOKIE_SECURE=true
  - OAUTH2_PROXY_COOKIE_SAMESITE=lax
  - OAUTH2_PROXY_COOKIE_REFRESH=1h  # re-validate the Google account hourly
  - OAUTH2_PROXY_COOKIE_EXPIRE=168h
  # No real upstream; an authenticated check just returns this status. Must be 200:
  # Envoy's ext_authz treats only 200 as allowed.
  - OAUTH2_PROXY_UPSTREAMS=static://200
  - OAUTH2_PROXY_REVERSE_PROXY=true  # trust X-Forwarded-* from the gateway
  - OAUTH2_PROXY_SET_XAUTHREQUEST=true  # emit X-Auth-Request-* headers on allow
  - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true  # straight to Google, no interstitial
  - OAUTH2_PROXY_SILENCE_PING_LOGGING=true
