apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Argo CD itself — the part install.sh can apply on a bare k3s with nothing but
# `kubectl apply -k` (no Helm, no SealedSecrets, no CRDs beyond Argo CD's own):
#   - the upstream install manifest (pinned version)
#   - insecure config (patched into argocd-cmd-params-cm)
#   - OIDC SSO via Google + email RBAC + `--enable-helm` for kustomize
#     (argocd-cm, argocd-rbac-cm)
# NOT the HTTPRoute: it needs the Gateway API CRDs, which Argo CD itself installs
# (platform/gateway-api), so it lives in ../ and is applied by the self-managing
# Application once they exist. ../apps/ holds the ApplicationSets + that
# Application; ../ ties base + apps + route + the sealed webhook secret together
# as what Argo CD manages for itself after bootstrap.
resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml

patches:
# Serve Argo CD over plain HTTP behind the gateway (insecure mode).
# Merged into the upstream argocd-cmd-params-cm, leaving its other keys intact.
- path: cmd-params-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
# OIDC SSO via Google (url + oidc.config) + kustomize build options, merged
# into argocd-cm.
- path: cm-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cm
# RBAC: listed Google accounts (email claim) -> Argo CD admin, merged into argocd-rbac-cm.
- path: rbac-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-rbac-cm
