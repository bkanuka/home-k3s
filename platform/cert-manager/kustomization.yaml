apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cert-manager: Let's Encrypt certs for the shared gateway's HTTPS listeners.
# Sync waves: 0 chart + gandi-credentials, 1 webhook-gandi/ (needs the CRDs),
# 2 clusterissuer.yaml (needs cert-manager's webhook serving).
resources:
- namespace.yaml
- gandi-credentials-sealed.yaml  # Gandi PAT (key pat) for the DNS-01 webhook
- webhook-gandi/
- clusterissuer.yaml

helmCharts:
- name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.0
  releaseName: cert-manager
  namespace: cert-manager
  includeCRDs: true
  valuesInline:
    crds:
      enabled: true
    # Gateway API support (gateway-shim) needs both flags.
    featureGates: "ExperimentalGatewayAPISupport=true"
    extraArgs:
    - --enable-gateway-api
