# FlareSolverr: Cloudflare challenge solver used only by Jackett (ServerConfig.json
# FlareSolverrUrl). Stateless; cluster-internal only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: jackett
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: America/Toronto
        ports:
        - name: http
          containerPort: 8191
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: jackett
spec:
  selector:
    app: flaresolverr
  ports:
  - name: http
    port: 8191
    targetPort: 8191
