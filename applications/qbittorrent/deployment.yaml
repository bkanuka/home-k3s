# qBittorrent + PIA WireGuard VPN. qBittorrent.conf is git-managed: the
# render-config initContainer writes the ConfigMap copy over /config on every start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate  # /config hostPath can't be shared by two pods
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
      # Keeps the old conf as .prev, writes the ConfigMap copy with the API key filled in.
      - name: render-config
        image: busybox:1.37.0
        command: ["sh", "-ec"]
        args:
        - |
          dst=/config/qBittorrent/config/qBittorrent.conf
          mkdir -p "$(dirname "$dst")"
          [ ! -f "$dst" ] || cp -p "$dst" "$dst.prev"
          sed "s|__WEBUI_API_KEY__|$WEBUI_API_KEY|" /seed/qBittorrent.conf > "$dst.tmp"
          chown 1000:1000 "$dst.tmp" && chmod 600 "$dst.tmp"
          mv "$dst.tmp" "$dst"
        env:
        - name: WEBUI_API_KEY
          valueFrom:
            secretKeyRef:
              name: qbittorrent-apikey
              key: WEBUI_API_KEY
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-seed
          mountPath: /seed
          readOnly: true
      containers:
      - name: qbittorrent
        image: j4ym0/pia-qbittorrent
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]  # WireGuard interface
        envFrom:
        - secretRef:  # PIA_USERNAME, PIA_PASSWORD
            name: pia-credentials
        env:
        - name: PIA_REGION
          value: ca_toronto
        - name: PORT_FORWARDING
          value: "true"
        - name: VPN_CLIENT
          value: wireguard
        - name: UID
          value: "1000"
        - name: GID
          value: "1000"
        - name: TZ
          value: America/Toronto
        ports:
        - name: webui
          containerPort: 8888
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: complete
          mountPath: /downloads/complete
        - name: temp
          mountPath: /downloads/temp
        - name: config
          mountPath: /config
        - name: mam  # myanonamouse session cookie
          mountPath: /mam
      volumes:
      - name: complete
        hostPath:
          path: /mnt/media/Unsorted
          type: Directory
      - name: temp
        hostPath:
          path: /mnt/media/Incomplete
          type: Directory
      - name: config
        hostPath:
          path: /mnt/main/config/qbittorrent
          type: Directory
      - name: mam
        hostPath:
          path: /mnt/main/config/qbittorrent/mam
          type: DirectoryOrCreate
      - name: config-seed
        configMap:
          name: qbittorrent-config
