# Requires Google login (oauth2-proxy) on this host, except the API (Tautulli checks ?apikey=) and static images used in notifications.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tautulli-ext-authz
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy  # extensionProvider in the Istio meshConfig
  rules:
  - to:
    - operation:
        hosts:
        - tautulli.home.bkanuka.com
        notPaths:
        - /api/*
        - /images/*
