# Glances config, mounted at /etc/glances/glances.conf. Only overrides are listed;
# anything absent uses Glances' built-in defaults. Reference for every key:
# https://github.com/nicolargo/glances/blob/develop/conf/glances.conf
#
# The host's / is mounted at /rootfs, so host mount points appear as /rootfs/...

[global]
check_update=False

[outputs]
max_processes_display=30

[network]
# The LAN bridge only (it carries enp6s0f0); skips lo, docker0 and k3s pod plumbing.
show=br0

[diskio]
# Whole disks only, not partitions.
hide=loop.*,/dev/loop.*,sd[a-z]+[0-9]+

[fs]
refresh=60
# Host root and the local ZFS pools; not kubelet or container mounts.
show=/rootfs,/rootfs/mnt/main.*,/rootfs/mnt/stripe.*
alias=/rootfs:root,/rootfs/mnt/main:main,/rootfs/mnt/stripe:stripe

[smart]
disable=False
refresh=300

[sensors]
hide=unknown.*

[containers]
# k3s runs containerd, which Glances can't read.
disable=True

[ip]
public_disabled=True
