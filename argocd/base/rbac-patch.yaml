# Argo CD RBAC: the listed Google accounts (OIDC email claim) are admin; the local
# "readonly" account (argocd-cm) may only read applications.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  policy.default: ""  # anyone else who signs in gets no access
  policy.csv: |
    g, bkanuka@gmail.com, role:admin
    p, role:readonly, applications, get, */*, allow
    g, readonly, role:readonly
  scopes: '[email]'
