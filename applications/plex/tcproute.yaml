# Raw TCP passthrough on :32400 for Plex Remote Access; Plex terminates its own
# TLS (*.plex.direct), so this can't go through the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1alpha2  # experimental Gateway API channel
kind: TCPRoute
metadata:
  name: plex-pms
  namespace: plex
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: plex-pms
  rules:
  - backendRefs:
    - name: plex
      port: 32400
