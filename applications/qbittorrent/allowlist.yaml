# Denies this host to anyone whose Google account is not listed below. Web API calls
# with an API key (Authorization: Bearer ...) skip Google login and are exempt here;
# qBittorrent validates the key.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: qbittorrent-allowlist
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: DENY
  rules:
  - to:
    - operation:
        hosts:
        - qbittorrent.home.bkanuka.com
        ports:
        - "443"  # HTTPS only; a DENY with just HTTP fields would also drop the Plex TCP listener
        notPaths:
        - /api/v2/*
    when:
    - key: request.headers[x-auth-request-email]  # set by oauth2-proxy (ext_authz)
      notValues:  # also matches when the header is absent
      - bkanuka@gmail.com
  - to:
    - operation:
        hosts:
        - qbittorrent.home.bkanuka.com
        ports:
        - "443"  # HTTPS only; a DENY with just HTTP fields would also drop the Plex TCP listener
        paths:
        - /api/v2/*
    when:
    - key: request.headers[x-auth-request-email]
      notValues:
      - bkanuka@gmail.com
    - key: request.headers[authorization]
      notValues:
      - Bearer *
