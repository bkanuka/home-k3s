apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# glances.conf is git-managed: edit it here.
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- authorizationpolicy.yaml  # Google login (oauth2-proxy)
- allowlist.yaml            # which accounts may use this host

configMapGenerator:
- name: glances-config  # hash suffix rolls the pod when the config changes
  namespace: glances
  files:
  - glances.conf
