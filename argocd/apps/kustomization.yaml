apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# What Argo CD deploys: one ApplicationSet each for platform/* and applications/*,
# plus the Application through which Argo CD manages its own ../ directory.
resources:
- applicationset-platform.yaml
- applicationset-applications.yaml
- application-argocd.yaml
