# Requires Google login (oauth2-proxy) on this host, except public share links (File Browser checks the share token).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: filebrowser-ext-authz
  namespace: istio-system  # must match the Gateway's namespace
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: home-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy  # extensionProvider in the Istio meshConfig
  rules:
  - to:
    - operation:
        hosts:
        - filebrowser.home.bkanuka.com
        notPaths:
        - /share/*
        - /api/public/*
