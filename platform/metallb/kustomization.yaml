apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MetalLB in L2 mode (replaces k3s's ServiceLB, disabled in k3s-config.yaml).
# config.yaml is sync wave 1 so MetalLB's validating webhook is up before it applies.
resources:
- https://raw.githubusercontent.com/metallb/metallb/v0.16.0/config/manifests/metallb-native.yaml
- config.yaml
