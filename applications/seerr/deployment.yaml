# Seerr (Overseerr/Jellyseerr successor): Plex users request movies and shows;
# fulfils them through Sonarr/Radarr. All state (settings.json with API keys,
# sqlite db) is app-written and lives on the hostPath. The image runs as uid 1000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate  # /app/config hostPath can't be shared by two pods
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      enableServiceLinks: false
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest
        env:
        - name: TZ
          value: America/Toronto
        - name: LOG_LEVEL
          value: info
        ports:
        - name: http
          containerPort: 5055
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        hostPath:
          path: /mnt/main/config/seerr
          type: Directory
