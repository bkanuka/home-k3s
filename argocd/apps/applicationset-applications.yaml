# One Application per applications/<name>/, each served at <name>.home.bkanuka.com.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/bkanuka/home-k3s.git
      revision: main
      directories:
      - path: applications/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        # "Open application" link in the Argo CD UI.
        link.argocd.argoproj.io/external-link: 'https://{{.path.basename}}.home.bkanuka.com'
    spec:
      project: default
      source:
        repoURL: https://github.com/bkanuka/home-k3s.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true      # delete resources removed from git
          selfHeal: true   # revert manual drift back to git state
        syncOptions:
        - CreateNamespace=true
