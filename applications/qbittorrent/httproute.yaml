# qBittorrent Web UI at qbittorrent.home.bkanuka.com over HTTPS, PROTECTED by Google login
# (oauth2-proxy forward-auth, see authorizationpolicy.yaml + allowlist.yaml and
# platform/oauth2-proxy/). The sign-in flow runs on auth.home.bkanuka.com and the
# session cookie is scoped to .home.bkanuka.com, so this route needs no auth
# carve-out: everything goes to the app, gated by ext_authz at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: https
  hostnames:
  - qbittorrent.home.bkanuka.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: qbittorrent
      port: 8888
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-https-redirect
  namespace: qbittorrent
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: http
  hostnames:
  - qbittorrent.home.bkanuka.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
