# ESPHome Device Builder at esphome.home.bkanuka.com, also a remote build server for
# other Device Builders (e.g. the HA add-on). hostNetwork so mDNS discovery and OTA
# to <device>.local work. On the LAN, :6052 (the UI, unauthenticated) and :6055 (the
# Noise-encrypted remote-build peer link, once enabled in Settings) are open on the host.
# YAML configs, build output and the PlatformIO cache live in /config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: esphome
spec:
  revisionHistoryLimit: 1  # old ReplicaSets kept for rollout undo
  replicas: 1
  strategy:
    type: Recreate  # hostNetwork: a second pod can't bind :6052
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      hostNetwork: true
      enableServiceLinks: false
      containers:
      - name: esphome
        image: ghcr.io/esphome/esphome:2026.11.1
        args: ["dashboard", "--remote-build-port", "6055", "/config"]
        env:
        - name: TZ
          value: America/Toronto
        ports:
        - name: http
          containerPort: 6052
        - name: peer-link
          containerPort: 6055
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /mnt/main/config/esphome
          type: DirectoryOrCreate
