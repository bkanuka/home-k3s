# Jackett UI at jackett.home.bkanuka.com; Google login is enforced at the gateway by
# authorizationpolicy.yaml. In-cluster consumers (Sonarr/Radarr) use the Service directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jackett
  namespace: jackett
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: https
  hostnames:
  - jackett.home.bkanuka.com
  rules:
  # Transitional: Jackett still serves under /jackett (BasePathOverride) because the
  # compose Sonarr/Radarr use that path; both go away in step 3 of docs/compose-migration.md.
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jackett/
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jackett
      port: 9117
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jackett-https-redirect
  namespace: jackett
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    name: home-gateway
    namespace: istio-system
    kind: Gateway
    sectionName: http
  hostnames:
  - jackett.home.bkanuka.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
