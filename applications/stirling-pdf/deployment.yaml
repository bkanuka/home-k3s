# Stirling-PDF. Its login is off (Google at the gateway instead); configs/ is
# app-written (settings.yml, H2 db, keys) and stays on the hostPath with the rest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate  # hostPaths can't be shared by two pods
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
      - name: stirling-pdf
        image: stirlingtools/stirling-pdf:latest-fat
        env:
        - name: SECURITY_ENABLELOGIN
          value: "false"
        - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
          value: "false"
        - name: LANGS
          value: en_US
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/Toronto
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /usr/share/tessdata
          subPath: tessdata
        - name: config
          mountPath: /configs
          subPath: configs
        - name: config
          mountPath: /customFiles
          subPath: customFiles
        - name: config
          mountPath: /logs
          subPath: logs
        - name: config
          mountPath: /pipeline
          subPath: pipeline
      volumes:
      - name: config
        hostPath:
          path: /mnt/main/config/stirling-pdf
          type: Directory
