apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SINTEF cert-manager-webhook-gandi: solves ACME DNS-01 challenges via the Gandi API.
# Sync wave 1: the chart creates Issuer/Certificate CRs, so cert-manager must be up first.
# Reads the gandi-credentials Secret (key pat) applied by ../; the chart RBAC hardcodes that name.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"

helmCharts:
- name: cert-manager-webhook-gandi
  repo: https://sintef.github.io/cert-manager-webhook-gandi
  version: v0.6.0
  releaseName: cert-manager-webhook-gandi
  namespace: cert-manager
  valuesInline:
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager  # cert-manager's controller SA, granted the domain-solver role
    # groupName stays at the chart default (acme.bwolf.me); clusterissuer.yaml references it.
