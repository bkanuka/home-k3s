# k3s server config; install.sh copies it to /etc/rancher/k3s/config.yaml. k3s
# reads it only at start, so restart k3s after changing it on a live node.
disable:
  - traefik    # replaced by Istio ingress (platform/istio)
  - servicelb  # replaced by MetalLB (platform/metallb)
write-kubeconfig-mode: "0644"  # kubeconfig readable without sudo
